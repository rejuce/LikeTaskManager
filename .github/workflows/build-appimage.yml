name: Build AppImage

on:
  push:
    branches: [ master, Qt6Cmake ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, Qt6Cmake ]
  workflow_dispatch:

permissions:
  contents: write

env:
  QWT_VERSION: "6.3.0"
  NETHOGS_VERSION: "v0.8.8"

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    # glibc must be <= 2.35 for linuxdeployqt to produce a broadly compatible AppImage.
    # The ubuntu-22.04 runner image itself ships glibc 2.35, so no container is needed.
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson make \
            libgl-dev \
            git curl wget unzip xz-utils file patchelf libfuse2 \
            desktop-file-utils xvfb \
            qt6-base-dev qt6-base-dev-tools qt6-l10n-tools \
            libqt6network6 libqt6widgets6 libqt6svg6-dev \
            libpcap-dev libnl-3-dev libnl-genl-3-dev

      - name: Checkout sources
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Qwt 6.x ships no CMake config; build from source into /usr/local
      # ------------------------------------------------------------------
      - name: Build Qwt
        run: |
          # Qwt 6.x ships no CMakeLists.txt (qmake-only),
          # so build with qmake6 which is available on ubuntu-22.04
          wget -q "https://downloads.sourceforge.net/project/qwt/qwt/${QWT_VERSION}/qwt-${QWT_VERSION}.tar.bz2" -O qwt.tar.bz2
          tar xf qwt.tar.bz2
          cd qwt-${QWT_VERSION}
          # disable OpenGL (not available in ubuntu-22.04 Qt6; app doesn't use it)
          sed -i 's/^QWT_CONFIG     += QwtOpenGL/#&/' qwtconfig.pri
          qmake6 qwt.pro -spec linux-g++ CONFIG+=release \
            QWT_BUILD_EXAMPLES=0 QWT_BUILD_TESTS=0 QWT_BUILD_DOCS=0
          make -j"$(nproc)"
          sudo make install          # installs to /usr/local/qwt-${QWT_VERSION}
          # register with ldconfig + make discoverable by the app's CMake
          echo "/usr/local/qwt-${QWT_VERSION}/lib" | sudo tee /etc/ld.so.conf.d/qwt.conf
          sudo ldconfig
          sudo ln -sfn /usr/local/qwt-${QWT_VERSION}/include /usr/local/include/qwt
          sudo ln -sfn /usr/local/qwt-${QWT_VERSION}/lib/libqwt.so* /usr/local/lib/

      # ------------------------------------------------------------------
      # libnethogs — built with meson. Skip 'meson install' (it fails on
      # some runners) and copy artifacts from the build tree instead.
      # The meson build bakes in a broken SONAME, so fix with patchelf.
      # ------------------------------------------------------------------
      - name: Build libnethogs
        run: |
          wget -q "https://github.com/raboof/nethogs/archive/refs/tags/${NETHOGS_VERSION}.tar.gz" -O nethogs.tar.gz
          tar xzf nethogs.tar.gz
          cd nethogs-${NETHOGS_VERSION#v}
          meson setup build
          meson compile -C build
          # find the built .so in the build tree
          SOFILE=$(find build -name 'liblibnethogs.so*' -type f | head -1)
          if [ -z "$SOFILE" ]; then
            echo "::error::libnethogs .so not found in build tree"
            find build -name '*.so*' 2>/dev/null
            exit 1
          fi
          echo "Found: $SOFILE"
          # copy to /usr/local/lib
          sudo cp "$SOFILE" /usr/local/lib/liblibnethogs.so
          # fix broken SONAME baked in by the meson build
          sudo patchelf --set-soname liblibnethogs.so /usr/local/lib/liblibnethogs.so
          # compatibility symlink: project links against -lnethogs
          sudo ln -sf liblibnethogs.so /usr/local/lib/libnethogs.so
          # install header (it's in src/libnethogs.h)
          sudo mkdir -p /usr/local/include/libnethogs
          sudo cp src/libnethogs.h /usr/local/include/libnethogs/
          # flat header expected by CMakeLists: libnethogs.h
          sudo ln -sf libnethogs/libnethogs.h /usr/local/include/libnethogs.h
          # make discoverable
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/libnethogs.conf
          sudo ldconfig

      - name: Build LikeTaskManager
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/LikeTaskManager AppDir/usr/bin/
          cp LikeTaskManager.desktop AppDir/usr/share/applications/
          cp ltm.PNG AppDir/usr/share/icons/hicolor/256x256/apps/LikeTaskManager.png

      - name: Download linuxdeployqt
        run: |
          curl -sL -o linuxdeployqt.AppImage \
            https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt.AppImage

      # ------------------------------------------------------------------
      # appimageupdatetool — the AppImageUpdate tool that the application's
      # built-in autoupdate (ltm.cpp) invokes at runtime.  It must sit in
      # AppDir/usr/bin/ with the exact name the code expects:
      #   qApp->applicationDirPath() + "/appimageupdatetool-x86_64.AppImage"
      # Without it the app shows: ERROR: FAILED appimageupdate not packaged
      # ------------------------------------------------------------------
      - name: Download appimageupdatetool
        run: |
          # Released from AppImageCommunity/AppImageUpdate (the old
          # probonopd/linuxdeploy-plugin-appimage repo has been deleted).
          curl -sfL -o appimageupdatetool-x86_64.AppImage \
            https://github.com/AppImageCommunity/AppImageUpdate/releases/download/continuous/appimageupdatetool-x86_64.AppImage
          chmod +x appimageupdatetool-x86_64.AppImage
          # Guard: ensure the download is a real AppImage (≥ 10 MB), not a 404 page.
          SIZE=$(stat -c%s appimageupdatetool-x86_64.AppImage 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::appimageupdatetool-x86_64.AppImage is only ${SIZE} bytes — download likely failed"
            exit 1
          fi
          echo "appimageupdatetool-x86_64.AppImage downloaded: ${SIZE} bytes"
          # Copy into the AppDir where the application expects it at runtime.
          cp appimageupdatetool-x86_64.AppImage AppDir/usr/bin/appimageupdatetool-x86_64.AppImage
          chmod +x AppDir/usr/bin/appimageupdatetool-x86_64.AppImage

      - name: Ensure qmake points to Qt6
        run: |
          # ubuntu-22.04 ships both Qt5 and Qt6; default 'qmake' is Qt5.
          # linuxdeployqt uses 'qmake' from $PATH to find the Qt version.
          # Symlink qmake6 as qmake in /usr/local/bin (ahead of /usr/bin in PATH).
          sudo ln -sf /usr/bin/qmake6 /usr/local/bin/qmake
          qmake -query QT_VERSION

      - name: Bundle AppImage
        run: |
          ./linuxdeployqt.AppImage AppDir/usr/share/applications/LikeTaskManager.desktop \
            -appimage -bundle-non-qt-libs -verbose=2 \
            -updateinformation="zsync|https://github.com/rejuce/LikeTaskManager/releases/latest/download/LikeTaskManager-x86_64.AppImage.zsync"
          # linuxdeployqt derives the file name from the build version (commit SHA
          # with actions/checkout without fetch-depth:0), so it may differ on every
          # build. Rename to a fixed name so the release asset URL never changes.
          # Guard the mv: if linuxdeployqt already produced the target name, 'mv' fails
          # with "are the same file" (exit 1).
          if [ ! -e LikeTaskManager-x86_64.AppImage ]; then
            mv LikeTaskManager-*.AppImage LikeTaskManager-x86_64.AppImage
          fi
          ls -lh LikeTaskManager-x86_64.AppImage
          chmod +x LikeTaskManager-x86_64.AppImage

      - name: Verify .zsync file (for AppImage autoupdate)
        run: |
          # linuxdeployqt already generated LikeTaskManager-x86_64.AppImage.zsync
          # during bundling: it runs its embedded 'zsyncmake' whenever
          # -updateinformation is provided (see bundle log:
          # "zsyncmake is available and updateinformation is provided, hence
          #  generating zsync file"). The system 'zsync' package is unreliable
          # across distro versions (MakeSyncFile vs --make-sync-file), so we
          # only verify the file exists here.
          ls -lh LikeTaskManager-x86_64.AppImage.zsync

      - name: Verify appimageupdatetool is bundled (for AppImage autoupdate)
        run: |
          # The built-in autoupdate (ltm.cpp) runs
          #   applicationDirPath() + "/appimageupdatetool-x86_64.AppImage"
          # which maps to usr/bin/ inside the AppImage.  Extract and check.
          ./LikeTaskManager-x86_64.AppImage --appimage-extract
          if [ -x squashfs-root/usr/bin/appimageupdatetool-x86_64.AppImage ]; then
            echo "appimageupdatetool-x86_64.AppImage is bundled - autoupdate will work"
          else
            echo "::error::appimageupdatetool-x86_64.AppImage not found in bundle"
            ls -la squashfs-root/usr/bin/
            exit 1
          fi

      # ------------------------------------------------------------------
      # Smoke test: run the AppImage headless on a virtual display and
      # confirm it stays alive for a few seconds.
      # ------------------------------------------------------------------
      - name: Smoke test AppImage
        run: |
          # GitHub Actions runners lack FUSE, so AppImages can't self-extract.
          # Use --appimage-extract to unpack, then run AppRun directly.
          APPIMAGE=LikeTaskManager-x86_64.AppImage
          chmod +x "$APPIMAGE"
          ./$APPIMAGE --appimage-extract
          xvfb-run -a -s "-screen 0 1024x768x24" timeout 20 ./squashfs-root/AppRun &
          APP_PID=$!
          sleep 10
          if kill -0 $APP_PID 2>/dev/null; then
            echo "AppImage started and stayed alive for 10s - OK"
            kill $APP_PID 2>/dev/null || true
          else
            echo "::error::AppImage exited early"
            exit 1
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: LikeTaskManager-x86_64.AppImage
          path: LikeTaskManager-x86_64.AppImage
          if-no-files-found: error

      - name: Upload .zsync artifact
        uses: actions/upload-artifact@v4
        with:
          name: LikeTaskManager-x86_64.AppImage.zsync
          path: LikeTaskManager-x86_64.AppImage.zsync
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Publish the AppImage as a GitHub Release.
  # Only runs on tag pushes (v*) or manual dispatch — not on every push/PR.
  # ----------------------------------------------------------------------
  release:
    needs: build-appimage
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: LikeTaskManager-x86_64.AppImage
          path: release-assets

      - name: Download .zsync artifact
        uses: actions/download-artifact@v4
        with:
          name: LikeTaskManager-x86_64.AppImage.zsync
          path: release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
